name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (testes unitários e e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e

  web:
    name: Web (testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker (compose build e smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait
      # Mesmo caminho que o avaliador percorre: tudo via nginx em :8080.
      - run: curl -sf localhost:8080/api/health | grep -q '"status":"ok"'
      - run: curl -sf localhost:8080/ | grep -q 'Censo 2022'
      - run: curl -sf -o /dev/null localhost:8080/estado
      - if: always()
        run: docker compose down -v
