name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (testes unitários e e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e

  web:
    name: Web (testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker (compose build e smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait
      # Mesmo caminho que o avaliador percorre: tudo via nginx em :8080.
      # Exige a contagem de mun_agg: prova que o bootstrap rodou, não só que a API subiu.
      - run: curl -sf localhost:8080/api/health | grep -q '"status":"ok".*"municipios":5571'
      - run: curl -sf localhost:8080/ | grep -q 'Censo 2022'
      - run: curl -sf -o /dev/null localhost:8080/estado
      # Um valor de referência por endpoint (regras-de-dados.md), via nginx.
      - run: curl -sf 'localhost:8080/api/municipios?q=sao' | grep -q 'São Paulo'
      - run: curl -sf localhost:8080/api/municipios/3550308 | grep -q '"densidade":7528.26'
      - run: curl -sf localhost:8080/api/ufs/35 | grep -q '"totalMunicipios":645'
      - run: curl -sf 'localhost:8080/api/ufs/35/municipios?page=2' | grep -q '"posicao":51'
      # Documentação da API atrás do proxy /api do nginx: o contrato e a interface.
      - run: curl -sf localhost:8080/api/docs-json | grep -q '"openapi":"3'
      - run: curl -sf -o /dev/null localhost:8080/api/docs
      - if: always()
        run: docker compose down -v
